[project]
name = "whence-backend"
version = "0.1.0"
description = "Whence · 来处：本地优先的个人记忆库（后端）"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy>=2.1.4",
    "sqlite-vec>=0.1.9",
    "cryptography>=50.0.2",
    "instructor>=1.17.0",
    "openai>=3.3.0",
    "python-multipart>=0.0.32",
    "python-docx>=1.2.0",
    "pypdf>=6.19.0",
    "pymupdf>=1.26.0",
    "filetype>=1.2.0",
    "rapidocr-onnxruntime>=1.4.4",
    "docling>=2.137.0",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
