# 自动构建后端镜像并推送到 GitHub Container Registry。
# 别人 `docker compose pull` 就能拿到现成镜像，不需要在本机 build。
#
# 首次运行后需要手动把包设为公开，否则别人拉取会 401：
#   GitHub → 你的头像 → Your packages → whence-backend → Package settings
#   → Change visibility → Public
name: docker

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 镜像依赖较重，先清掉 runner 上不用的 SDK，避免构建时磁盘不足
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/whence-backend:latest
            ghcr.io/${{ github.repository_owner }}/whence-backend:${{ github.sha }}
          platforms: linux/amd64
          # 不需要 attestation 产物，避免 registry 里出现 unknown/unknown 条目
          provenance: false
          # 用 GitHub Actions 缓存依赖层，避免每次重新装一遍 torch/docling
          cache-from: type=gha
          cache-to: type=gha,mode=max
